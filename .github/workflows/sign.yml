name: SKAS Auto Sign

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install token helper dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/skas"
          "$RUNNER_TEMP/skas/bin/python" -m pip install cryptography==50.0.2

      - name: Run Sign
        env:
          SKYLAND_TOKEN: ${{ secrets.SKYLAND_TOKEN }}
          SKYLAND_TOKEN_KEY: ${{ secrets.SKYLAND_TOKEN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ENABLE_GAMES: arknights,endfield
        run: '"$RUNNER_TEMP/skas/bin/python" scripts/skyland_token.py run'
